services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: iit-rag-backend:dev
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/backend/data:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: iit-rag-frontend:dev
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      IIT_BACKEND_URL: http://backend:8000
    depends_on:
      - backend